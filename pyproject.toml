[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdrift-detection"
version = "0.0.1"
description = "Early guardrail against indirect prompt injection hijacking of AI agents (ESILV ML project)."
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
