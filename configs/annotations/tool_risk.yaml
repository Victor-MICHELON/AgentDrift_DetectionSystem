# Risk category of each AgentDrift tool (PLAN_DONNEES step 6, CONTEXT §7.1).
#
# A tool's category describes what the tool does by design (its name and declared effect), not how one
# trajectory happens to use it. A risky use of a harmless tool (e.g. a recipient in `fill_form`) is the job of
# the provenance features, not of this table.
#
# Use: structure feature (H1), replacement of the tool name in leave-one-domain-out, EDA part B.
# Never fitted on labels: the categories were set from tool names and one example per tool, without looking at
# how often each tool appears in H steps (no label leakage, rule 2).
#
# Workflow: draft by the AI -> review by a second team member -> status: validated.
# Mark each change in `changes` below, and flip `ambiguous` to false once the team agrees.

status: draft            # draft | validated
annotator: Claude Code (draft, 2026-11-21)
reviewer: null           # team member who cross-checked the table (PLAN_DONNEES, pending decision 3)
reviewed_on: null
changes: []              # e.g. "- 2026-11-22 Oscar: git_push external_send -> internal_write (reason)"

categories:
  read: reads or computes, changes nothing outside the agent's view (navigation included)
  internal_write: creates or modifies state that stays inside the user's own system or organisation
  external_send: sends data, messages or credentials to a party outside the user's system
  payment: moves money or commits the user financially
  delete: removes data or cancels an existing object
  execute: runs code or commands chosen at run time

