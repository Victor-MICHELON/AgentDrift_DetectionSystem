# Evaluation protocol (CONTEXT.md section 8.1).
seed: 42
group_key: task        # task template string (250 templates; maps to task_id via pools/*_tasks.json)
domain_key: agent      # email | banking | web | coding | medical
strata: [source_category, agent]   # stratification only, never model inputs
fixed_test: true       # data_taskdisjoint/test.jsonl = 35 templates, 1,722 trajectories, untouched
                       # train + val merged (215 templates) for the grouped CV below
outer_folds: 5         # StratifiedGroupKFold by task template
inner_folds: 3         # nested CV for tuning and calibration
leave_one_domain_out: true
target_fpr_per_step: [0.01, 0.002]
bootstrap:
  n_resamples: 2000
  unit: task           # cluster bootstrap: resample tasks, never steps
  ci: 0.95
