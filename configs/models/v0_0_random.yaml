# v0.0 — uniform random scores (KAN-20): control of the bootstrap and of the metric code (ROC-AUC 0.5 on average).
version: v0_0_random
kind: trivial
description: Uniform random scores, seeded; expected ROC-AUC 0.5, PR-AUC = prevalence.
views: [scanner, gate]
text: anon
include_thought: false
