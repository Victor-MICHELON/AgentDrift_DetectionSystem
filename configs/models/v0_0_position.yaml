# v0.0 — position only (KAN-20): P(target | step index t) learned on the training rows. A SHORTCUT (CONTEXT 6.2,
# injections at t = 1-3): the floor any content model must beat on y_scan (EDA train -> val: ROC-AUC 0.876 / 0.779).
version: v0_0_position
kind: shortcut
description: Empirical rate of the target at the step index t (one-hot t + logistic regression); reads nothing else.
views: [scanner, gate]
text: anon
include_thought: false
columns: [step]
uses_position: true
evaluation: cv
model:
  factory: agentdrift.models.baselines:position_only
  params: {}
threshold_source: inner_oof
target_fpr: [0.01, 0.002]
bootstrap: {n_resamples: 2000, seed: 42}
seed: 42
